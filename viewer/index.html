<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNO055 viewer</title>
<style>
  :root { --bg:#14181c; --fg:#e8edf0; --muted:#8a96a0; --ok:#3ecf8e; --bad:#e5534b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  #hud { position:absolute; top:12px; left:16px; line-height:1.6; }
  #hud b { font-variant-numeric:tabular-nums; }
  #status { color:var(--bad); }
  #status.live { color:var(--ok); }
  .cal span { display:inline-block; min-width:70px; color:var(--muted); }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <div id="status">waiting for data...</div>
  <div>Heading <b id="h">-</b>&deg; &nbsp; Pitch <b id="p">-</b>&deg; &nbsp; Roll <b id="r">-</b>&deg;</div>
  <div class="cal"><span>sys <b id="c0">-</b>/3</span><span>gyro <b id="c1">-</b>/3</span><span>accel <b id="c2">-</b>/3</span><span>mag <b id="c3">-</b>/3</span></div>
  <div style="color:var(--muted)">Drag to orbit. Press Z to set the current pose as "zero".</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181c);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3, 2.5, 4);
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(3, 5, 2);
scene.add(sun);
scene.add(new THREE.GridHelper(8, 16, 0x2a3138, 0x20262b));

// A board-shaped box with coloured axes (red X, green Y, blue Z in sensor frame)
const body = new THREE.Group();
body.add(new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 1.4), new THREE.MeshStandardMaterial({ color: 0x6a3d8a })));
body.add(new THREE.AxesHelper(1.6));
scene.add(body);

let latest = new THREE.Quaternion(), zero = new THREE.Quaternion();
let lastMsg = 0;

// BNO055 frame is Z-up; three.js is Y-up. Map (x, y, z) -> (x, z, -y).
function fromBno(w, x, y, z) { return new THREE.Quaternion(x, z, -y, w); }

const ev = new EventSource("/events");
ev.onmessage = (m) => {
  const d = JSON.parse(m.data);
  if (d.quaternion) latest = fromBno(...d.quaternion);
  if (d.orientation) {
    const [h, p, r] = d.orientation;
    document.getElementById("h").textContent = h.toFixed(1);
    document.getElementById("p").textContent = p.toFixed(1);
    document.getElementById("r").textContent = r.toFixed(1);
  }
  if (d.calibration) d.calibration.forEach((v, i) => document.getElementById("c" + i).textContent = v);
  lastMsg = performance.now();
};
addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "z") zero = latest.clone().invert(); });

// Simple orbit: drag to rotate the camera around the origin
let drag = false, yaw = Math.atan2(3, 4), pitch = 0.5, dist = 5.8;
renderer.domElement.onpointerdown = () => drag = true;
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", (e) => { if (!drag) return; yaw -= e.movementX * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + e.movementY * 0.01)); });
addEventListener("wheel", (e) => { dist = Math.max(2, Math.min(15, dist + e.deltaY * 0.005)); });
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

function frame(now) {
  body.quaternion.slerp(zero.clone().multiply(latest), 0.4);
  camera.position.set(dist * Math.sin(yaw) * Math.cos(pitch), dist * Math.sin(pitch), dist * Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(0, 0, 0);
  const live = now - lastMsg < 1000;
  const s = document.getElementById("status");
  s.textContent = live ? "live" : "waiting for data...";
  s.className = live ? "live" : "";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
